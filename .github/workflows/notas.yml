name: Monitor de notas UCSC

# Cada ejecución revisa el portal cada 15 minutos durante ~5 h 45 min y al
# terminar se relanza sola. El cron horario es solo un respaldo por si la
# cadena se corta (el cron de GitHub es poco confiable para intervalos cortos).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # guardar estado, relanzarse, mantener activo y desactivarse si falla el login
  issues: write    # aviso de respaldo si ntfy no responde

concurrency:
  group: monitor-notas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: notas/requirements.txt

      - name: Guardar navegador en caché
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('notas/requirements.txt') }}

      - name: Preparar navegador
        run: |
          pip install -r notas/requirements.txt
          playwright install --with-deps chromium

      - name: Recuperar estado anterior
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: estado-notas-${{ github.run_id }}
          restore-keys: estado-notas-

      - name: Probar conexión con la UCSC
        # Solo diagnóstico: muestra si el portal (o toda la UCSC) responde
        # desde los servidores de GitHub. No usa tu cuenta.
        continue-on-error: true
        run: |
          echo "País del servidor: $(curl -s -m 10 https://ipinfo.io/country || echo '?')"
          for url in https://portal.ucsc.cl/alumno https://www.ucsc.cl https://www.uchile.cl; do
            echo "$url -> $(curl -s -o /dev/null -m 20 -w '%{http_code} en %{time_total}s' "$url" || echo 'sin respuesta')"
          done

      - name: Revisar notas cada 15 minutos
        id: revisar
        env:
          UCSC_RUT: ${{ secrets.UCSC_RUT }}
          UCSC_PASSWORD: ${{ secrets.UCSC_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          fin=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$fin" ]; do
            inicio=$(date +%s)
            set +e
            python notas/revisar_notas.py
            codigo=$?
            set -e
            if [ "$codigo" -eq 2 ]; then
              echo "rechazado=1" >> "$GITHUB_OUTPUT"
              exit 1   # login rechazado: no seguir intentando
            fi
            espera=$(( 900 - ($(date +%s) - inicio) ))
            if [ "$espera" -gt 0 ]; then sleep "$espera"; fi
          done

      - name: Guardar estado
        if: always() && hashFiles('estado/*') != ''
        uses: actions/cache/save@v4
        with:
          path: estado
          key: estado-notas-${{ github.run_id }}

      - name: Relanzar el monitor
        # Solo si el ciclo terminó bien; si algo falló, el cron horario lo reintenta
        # (así un error de instalación no genera un bucle de relanzamientos).
        if: steps.revisar.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/notas.yml/enable" || true
          gh workflow run notas.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

      - name: Desactivar si el portal rechazó el login
        if: failure() && steps.revisar.outputs.rechazado == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable notas.yml --repo "$GITHUB_REPOSITORY"
