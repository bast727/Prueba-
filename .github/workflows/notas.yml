name: Monitor de notas UCSC

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos, el mínimo de GitHub (a veces se atrasa)
  workflow_dispatch:         # botón "Run workflow" para probar a mano

permissions:
  contents: read
  actions: write   # guardar estado, mantener activo y desactivarse si falla el login
  issues: write    # aviso de respaldo si ntfy no responde

concurrency:
  group: monitor-notas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: notas/requirements.txt

      - name: Guardar navegador en caché
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('notas/requirements.txt') }}

      - name: Preparar navegador
        run: |
          pip install -r notas/requirements.txt
          playwright install --with-deps chromium

      - name: Recuperar estado anterior
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: estado-notas-${{ github.run_id }}
          restore-keys: estado-notas-

      - name: Revisar notas
        id: revisar
        env:
          UCSC_RUT: ${{ secrets.UCSC_RUT }}
          UCSC_PASSWORD: ${{ secrets.UCSC_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python notas/revisar_notas.py

      - name: Guardar estado
        if: always() && hashFiles('estado/*') != ''
        uses: actions/cache/save@v4
        with:
          path: estado
          key: estado-notas-${{ github.run_id }}

      - name: Mantener activo (GitHub pausa repos sin actividad por 60 días)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/notas.yml/enable" || true

      - name: Desactivar si el portal rechazó el login
        if: failure() && steps.revisar.outputs.rechazado == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable notas.yml --repo "$GITHUB_REPOSITORY"
